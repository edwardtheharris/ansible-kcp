###
# ```{rubric} Ansible Lint Jobs
# ```
# ---
# This action lints Ansible code for quality.
#
# ```{literalinclude} .github/workflows/ansible-lint.yml
# :language: yaml
# :caption: .github/workflows/ansible-lint.yml
# ```
name: Ansible Lint
on:
  pull_request:
    branches: ["main", "stable", "release/v*"]
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    ###
    # Naming the build is important to use it as a status check
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: 3.14
      - name: Install pipenv
        run: python3.14 -m pip install -U pip pipenv
      - name: Get reqs
        run: pipenv requirements --dev > reqs
      - name: Install reqs
        run: pip install -U reqs
      - name: Add virtualenv
        run: sudo mkdir -pv /etc/ansible
      - name: Update ansible dir ownership
        run: sudo chown ${USER} /etc/ansible
      - name: Add a vault file
        run: echo "Pass" > /etc/ansible/vault
      - name: Run ansible-lint
        ###
        # or version tag instead of 'main'
        uses: ansible/ansible-lint@main
        with:
          setup_python: "true"
